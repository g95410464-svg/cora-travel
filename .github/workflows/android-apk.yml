name: Build CORA Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cora-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --build-number=1000${{ github.run_number }}

      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/CORA-Travel.apk

      - name: Upload CORA APK
        uses: actions/upload-artifact@v4
        with:
          name: CORA-Travel-Android-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/CORA-Travel.apk
          if-no-files-found: error
          retention-days: 30
